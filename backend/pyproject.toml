[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.140.7",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
# B008: Depends()/File() in argument defaults is the correct FastAPI pattern,
# not a bug - FastAPI relies on that call-time evaluation for its dependency graph.
ignore = ["B008"]
